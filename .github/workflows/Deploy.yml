name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Discover Changed Modules
        id: discover
        shell: pwsh
        run: |
          $changed = git diff --name-only HEAD~ HEAD
          $changed
          $modules = @()
          foreach ($file in $changed) {
            $parts = $file -split '/'
            if ($parts.Length -ge 2 -and $parts[0] -eq 'Modules') {
              $modules += $parts[1]
            }
          }
          $modules = $modules | Sort-Object -Unique
          Write-Host "Changed modules: $($modules -join ', ')"
          "modules=$($modules -join ',')" >> $env:GITHUB_OUTPUT

      - name: Install PSResourceGet
        if: steps.discover.outputs.modules != ''
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
            Install-Module -Name Microsoft.PowerShell.PSResourceGet -Force -Scope CurrentUser
          }

      - name: Publish to PowerShell Gallery
        if: steps.discover.outputs.modules != ''
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: |
          Import-Module Microsoft.PowerShell.PSResourceGet

          # Publish in dependency order: leaf modules first, umbrella last.
          $order = @(
            'IntelliTect.Common',
            'IntelliTect.File',
            'IntelliTect.Git',
            'IntelliTect.PSToolbox'
          )
          $changed = '${{ steps.discover.outputs.modules }}' -split ','

          foreach ($name in $order) {
            if ($changed -notcontains $name) { continue }
            $path = Join-Path '.' 'Modules' $name
            $manifestPath = Join-Path $path "$name.psd1"
            if (-not (Test-Path $manifestPath)) {
              Write-Warning "Manifest not found for $name at $manifestPath; skipping."
              continue
            }
            $data = Import-PowerShellDataFile -Path $manifestPath
            $version = $data.ModuleVersion
            Write-Host "Checking PSGallery for $name $version ..."
            $existing = Find-PSResource -Name $name -Version $version -Repository PSGallery -ErrorAction SilentlyContinue
            if ($existing) {
              Write-Host "$name $version already on PSGallery; skipping."
              continue
            }
            Write-Host "Publishing $name $version ..."
            Publish-PSResource -Path $path -ApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -SkipModuleManifestValidate -Verbose
          }
